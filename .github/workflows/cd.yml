name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # A manual run must target a version tag, so a failed release can be replayed.
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  release:
    name: Publish the hub image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Check the ref is a version tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::This workflow publishes a release, so it must run on a v*.*.* tag ref."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uses the workflow GITHUB_TOKEN (needs packages: write), so no extra
      # secret is required. Pushes to ghcr.io/gromnan/mercure-mongodb.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
