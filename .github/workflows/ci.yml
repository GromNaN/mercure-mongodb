name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      # MongoDB Atlas Local runs a single node replica set and initializes it on
      # startup, so change streams work out of the box.
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Integration tests
        run: MONGODB_URI='mongodb://localhost:27017/?directConnection=true' go test -race -run TestIntegration -count=1 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    services:
      # The hub needs a replica set, for change streams, and a MongoDB to talk to.
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Build the binary the same way GoReleaser does, so the smoke test
      # exercises the tags and options that ship in the image.
      - name: Build the hub binary
        run: |
          mkdir -p linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags deprecated_transport,deprecated_topic,deprecated_claim,nobadger,nomysql,nopgx \
            -o linux/amd64/mercure-mongodb ./caddy/mercure

      - name: Build the image
        run: docker build --build-arg TARGETPLATFORM=linux/amd64 -t mercure-mongodb:ci .

      - name: Smoke test the image
        run: ./.github/scripts/smoke-test-image.sh mercure-mongodb:ci
