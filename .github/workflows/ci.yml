name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      # MongoDB Atlas Local runs a single node replica set and initializes it on
      # startup, so change streams work out of the box.
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Integration tests
        run: MONGODB_URI='mongodb://localhost:27017/?directConnection=true' go test -race -run TestIntegration -count=1 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    services:
      # The hub needs a replica set, for change streams, and a MongoDB to talk to.
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Build the binary the same way GoReleaser does, so the smoke test
      # exercises the tags and options that ship in the image.
      - name: Build the hub binary
        run: |
          mkdir -p linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags deprecated_transport,deprecated_topic,deprecated_claim,nobadger,nomysql,nopgx \
            -o linux/amd64/mercure-mongodb ./caddy/mercure

      - name: Build the image
        run: docker build --build-arg TARGETPLATFORM=linux/amd64 -t mercure-mongodb:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name hub --network host \
            -e SERVER_NAME=:3000 \
            -e MERCURE_TRUSTED_ISSUERS='http://localhost:3000' \
            -e MERCURE_MONGODB_URI='mongodb://localhost:27017/?directConnection=true' \
            -e MERCURE_PUBLISHER_JWT_KEY=change-me \
            -e MERCURE_SUBSCRIBER_JWT_KEY=change-me \
            mercure-mongodb:ci

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:2019/mercure/health/ready; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "the hub did not become ready"
            docker logs hub
            exit 1
          fi

          ISSUER='http://localhost:3000'
          AUDIENCE='http://localhost:3000/.well-known/mercure'
          PUBLISHER_JWT=$(printf '%s' change-me | docker exec -i hub caddy mercure-token \
            --iss "$ISSUER" --aud "$AUDIENCE" --key @- --publish '*')
          SUBSCRIBER_JWT=$(printf '%s' change-me | docker exec -i hub caddy mercure-token \
            --iss "$ISSUER" --aud "$AUDIENCE" --key @- --subscribe '*')

          curl -sN --max-time 20 \
            "http://localhost:3000/.well-known/mercure?match=https%3A%2F%2Fexample.com%2Fbooks%2F1" \
            -H "Authorization: Bearer $SUBSCRIBER_JWT" > /tmp/sse.out &
          subscriber=$!
          sleep 2

          curl -fsS -X POST http://localhost:3000/.well-known/mercure \
            -H "Authorization: Bearer $PUBLISHER_JWT" \
            --data-urlencode 'topic=https://example.com/books/1' \
            --data-urlencode 'data=hello'

          sleep 1
          kill "$subscriber" 2>/dev/null || true
          wait "$subscriber" 2>/dev/null || true
          if ! grep -q 'data: hello' /tmp/sse.out; then
            echo "the subscriber did not receive the update"
            cat /tmp/sse.out
            docker logs hub
            exit 1
          fi
